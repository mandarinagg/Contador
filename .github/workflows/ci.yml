# CI de CONTADOR AI.
# - test: pruebas, lint y tipos de backend y frontend (Linux, PostgreSQL 18 real).
# - e2e: Playwright (Chromium) contra la API real y una base PostgreSQL vacía.
# - secrets: el repositorio es público; gitleaks revisa todo el historial.
# - windows: backend empaquetado + PostgreSQL portable + lanzador + instalador NSIS,
#   probado de punta a punta en Windows real (lo mismo que se instala en Windows 11).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.14"
  NODE_VERSION: "24"
  PG_WINDOWS_ZIP: postgresql-18.7-1-windows-x64-binaries.zip

jobs:
  secrets:
    # El repositorio es público: se revisa todo el historial en cada push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.gitleaks.toml --redact --no-banner

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: contador
          POSTGRES_PASSWORD: contador_dev
          POSTGRES_DB: contador
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U contador -d contador"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend — dependencias
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Backend — lint, tipos, migraciones y pruebas
        working-directory: backend
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy app
          .venv/bin/alembic upgrade head
          .venv/bin/alembic check
          .venv/bin/alembic downgrade base
          .venv/bin/alembic upgrade head
          .venv/bin/pytest

      - name: Frontend — dependencias
        working-directory: frontend
        run: npm ci
      - name: Frontend — tipos, lint, pruebas y build
        working-directory: frontend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

  e2e:
    # Navegador real (Chromium) contra la API y el build del frontend, con una base vacía propia.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: contador
          POSTGRES_PASSWORD: contador_dev
          POSTGRES_DB: contador
        ports: ["55433:5432"]
        options: >-
          --health-cmd "pg_isready -U contador -d contador"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend — dependencias
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
      - name: Frontend — dependencias y Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: E2E (Playwright)
        working-directory: frontend
        run: npm run e2e
      - name: Publicar reporte de E2E
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  windows:
    # Todo lo que llega a la PC con Windows 11: backend empaquetado, PostgreSQL portable,
    # lanzador (Rust) e instalador NSIS, probado de punta a punta en Windows real.
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json
      - name: Rust (cache)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Empaquetar backend (PyInstaller)
        working-directory: backend
        run: |
          python -m venv .venv
          .venv\Scripts\pip install -e ".[build]"
          .venv\Scripts\pyinstaller packaging/contador-backend.spec --noconfirm --log-level WARN

      - name: PostgreSQL portable (cache)
        uses: actions/cache@v6
        with:
          path: build/pgsql
          key: ${{ env.PG_WINDOWS_ZIP }}-trimmed-v2

      - name: PostgreSQL portable (descarga y recorte)
        run: |
          if (-not (Test-Path build\pgsql\bin\postgres.exe)) {
            New-Item -ItemType Directory -Force build | Out-Null
            Invoke-WebRequest "https://get.enterprisedb.com/postgresql/$env:PG_WINDOWS_ZIP" -OutFile build\pg.zip
            tar -xf build\pg.zip -C build
            Remove-Item build\pg.zip
            # Solo el servidor y sus herramientas: fuera pgAdmin, documentación, StackBuilder,
            # cabeceras, símbolos de depuración y bibliotecas de enlace (.lib).
            foreach ($d in "pgAdmin 4", "doc", "StackBuilder", "include", "symbols") {
              Remove-Item -Recurse -Force "build\pgsql\$d" -ErrorAction SilentlyContinue
            }
            Get-ChildItem build\pgsql -Recurse -Include *.lib, *.pdb | Remove-Item -Force
          }
          build\pgsql\bin\postgres.exe --version
          Get-ChildItem build\pgsql -Directory | ForEach-Object {
            "{0,-10} {1,6:N0} MB" -f $_.Name, ((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1MB)
          }

      - name: Lanzador — formato y lint
        working-directory: desktop/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      - name: Lanzador — prueba con binarios reales y Administrador de credenciales
        working-directory: desktop/src-tauri
        run: |
          $env:CONTADOR_TEST_PGSQL_BIN = Resolve-Path ..\..\build\pgsql\bin
          $env:CONTADOR_TEST_BACKEND_EXE = Resolve-Path ..\..\backend\dist\contador-backend\contador-backend.exe
          cargo test -- --ignored --test-threads=1

      - name: Instalador NSIS
        run: |
          npm ci --prefix frontend
          npm ci --prefix desktop
          npm --prefix desktop run build
          $exe = Get-ChildItem desktop\src-tauri\target\release\bundle\nsis\*.exe
          "Instalador: {0} ({1:N0} MB)" -f $exe.Name, ($exe.Length / 1MB)

      - name: Publicar instalador
        uses: actions/upload-artifact@v7
        with:
          name: contador-ai-windows-instalador
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30

      - name: Prueba del instalador (instalar, abrir, cerrar, reabrir, desinstalar)
        run: |
          $installer = (Get-ChildItem desktop\src-tauri\target\release\bundle\nsis\*.exe).FullName
          Start-Process $installer -ArgumentList "/S" -Wait
          $backend = Get-ChildItem $env:LOCALAPPDATA -Recurse -Depth 3 -Filter contador-backend.exe | Select-Object -First 1
          if (-not $backend) { throw "El instalador no copió el backend" }
          $dir = $backend.Directory.Parent.FullName
          "Instalado en: $dir"
          if (-not (Test-Path "$dir\pgsql\bin\postgres.exe")) { throw "El instalador no copió PostgreSQL" }
          $app = Get-ChildItem $dir -Filter *.exe | Where-Object { $_.Name -notmatch "^uninstall" } | Select-Object -First 1
          $data = Join-Path $env:LOCALAPPDATA "ContadorAI"
          $health = "http://127.0.0.1:8765/api/v1/system/health"
          function Wait-Health([int]$seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              try { Invoke-RestMethod $health | Out-Null; return } catch { Start-Sleep 1 }
            }
            Get-ChildItem "$data\logs" -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 30 }
            throw "La API no respondió en $seconds s"
          }
          function Port-Open { try { Invoke-RestMethod $health | Out-Null; $true } catch { $false } }

          # 1. Primer arranque: crea la base en %LOCALAPPDATA%\ContadorAI y levanta todo.
          $p = Start-Process $app.FullName -PassThru
          Wait-Health 180
          if (-not (Test-Path "$data\pgdata\PG_VERSION")) { throw "No se creó la base en $data" }
          "Primer arranque OK"

          # 2. Cierre forzado (como un corte): el backend debe morir con la app (job object).
          Stop-Process -Id $p.Id -Force
          Start-Sleep 3
          if (Port-Open) { throw "El backend siguió vivo después de matar la app" }
          "Cierre forzado OK: el backend murió con la app"

          # 3. Reapertura: reutiliza el PostgreSQL que quedó en marcha.
          $p = Start-Process $app.FullName -PassThru
          Wait-Health 120
          "Reapertura OK"

          # 4. Cierre normal: detiene backend y PostgreSQL.
          $p.CloseMainWindow() | Out-Null
          if (-not $p.WaitForExit(60000)) { throw "La app no se cerró" }
          Start-Sleep 2
          if (Port-Open) { throw "El backend siguió vivo después de cerrar la app" }
          & "$dir\pgsql\bin\pg_ctl.exe" status -D "$data\pgdata"
          if ($LASTEXITCODE -ne 3) { throw "PostgreSQL siguió en marcha después de cerrar la app" }
          "Cierre normal OK: backend y PostgreSQL detenidos"

          # 5. Desinstalar no borra la contabilidad.
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep 3
          if (-not (Test-Path "$data\pgdata\PG_VERSION")) { throw "La desinstalación borró los datos" }
          "Desinstalación OK: los datos siguen en $data"
