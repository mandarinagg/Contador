[package]
name = "contador-desktop"
version = "0.1.0"
description = "CONTADOR AI — aplicación de escritorio"
authors = ["CONTADOR AI"]
license = "Propietaria"
repository = "https://github.com/mandarinagg/Contador"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "contador_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
log = "0.4"
tauri = { version = "2.12.7", features = [] }
tauri-plugin-log = "2.10.2"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-single-instance = "2.5.5"
getrandom = "0.4.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects"] }
