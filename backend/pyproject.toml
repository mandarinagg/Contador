[project]
name = "contador-backend"
version = "0.1.0"
description = "CONTADOR AI — backend local (FastAPI)"
requires-python = ">=3.12"
# Versiones fijas: verificadas en Python 3.14 el 2026-11-23 (ver docs/DECISIONS.md).
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.54.0",
  "pydantic[email]==2.14.4",
  "pydantic-settings==2.16.3",
  "sqlalchemy==2.1.9",
  "alembic==1.20.1",
  "psycopg[binary]==3.3.9",
  "argon2-cffi==25.1.0",
  "openpyxl==3.1.5",  # lectura de extractos XLSX (fase 2)
  "defusedxml==0.7.1",  # openpyxl lo usa solo: XML de los XLSX sin expansión de entidades
  "python-multipart==0.0.34",  # formularios multipart (subida de extractos)
  # Bot de Marangatu (docs/specs/BOT_MARANGATU.md). Playwright maneja el navegador (en Windows,
  # el Edge del sistema: no se empaqueta Chromium); keyring guarda la clave en el almacén de
  # credenciales del sistema; PyYAML escribe el borrador del catálogo del reconocimiento.
  "playwright==1.65.2",
  "keyring==25.7.0",
  "pyyaml==6.0.4",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "httpx2==2.16.2",  # cliente de TestClient (starlette depreca httpx)
  "ruff==0.17.6",
  "mypy==2.4.1",
  "types-openpyxl==3.1.5.20261122",  # tipos de openpyxl para mypy estricto
  "types-PyYAML==6.0.12.20261122",  # tipos de PyYAML para mypy estricto
]

# Empaquetado del backend como ejecutable (ver docs/ARCHITECTURE.md § Distribución).
build = [
  "pyinstaller==6.22.3",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
markers = ["slow: pruebas de rendimiento con muchos datos (más lentas)"]
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = [
  "S101",    # assert en pruebas
  "RUF012",  # __table_args__ de SQLAlchemy es un dict de clase por diseño
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"migrations/*" = ["E501"]
"app/modules/accounting/proposed_chart.py" = ["E501"]  # generado desde el YAML
"app/modules/accounting/proposed_asset_categories.py" = ["E501"]  # generado desde el YAML
"app/modules/tax/candidate_rules.py" = ["E501", "RUF001"]  # generado desde el YAML
"app/modules/tax/candidate_holidays.py" = ["E501", "RUF001"]  # generado desde el YAML
"app/modules/marangatu/pantallas.py" = ["E501", "RUF001"]  # generado desde el YAML

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]
