<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Marangatu - Ingreso</title></head>
<body>
  <h1>Ingreso al sistema</h1>
  <!-- Portal simulado: imita la pantalla de ingreso del catálogo PROVISORIO. -->
  <form method="post" action="/eset/login">
    <label for="usuario">Usuario</label> <input id="usuario" name="usuario" type="text">
    <label for="clave">Contraseña</label> <input id="clave" name="clave" type="password">
    <button id="ingresar" type="submit">Ingresar</button>
  </form>
  <a href="/eset/olvide">¿Olvidó su clave?</a>
</body></html>
