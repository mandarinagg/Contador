# PLAN DE CUENTAS PROPUESTO — PROPUESTA, NO VALIDADA
#
# Estado: borrador para que el contador lo valide. NO es un plan oficial.
# No encontré un plan de cuentas oficial obligatorio para empresas privadas en Paraguay.
# Base: códigos y nombres del modelo de estados financieros de la RG N° 49/2014 (DNIT),
# Anexos 1 (Balance General) y 2 (Estado de Resultados). Su art. 3° obliga a usar esos
# códigos en los estados financieros y permite agregar cuentas o subcuentas.
#   https://www.dnit.gov.py/documents/20123/209894/Resoluci%C3%B3n+General+N%C2%B0+49_14+Anexos.xls/1be53adb-b8a2-37d3-2561-7d2b93810387?t=1684192313142
#   consultado: 2026-11-24
#
# Campos:
#   codigo      código jerárquico (separado por puntos)
#   nombre
#   tipo        activo | pasivo | patrimonio | ingreso | gasto
#   naturaleza  deudora | acreedora (saldo normal)
#   imputable   true = recibe asientos; false = cuenta agrupadora
#   padre       código de la cuenta superior (null en la raíz)
#   origen      rg49_2014 = código y nombre del modelo oficial; propuesta = agregada aquí
#   nota        opcional
#
# Notas:
# - Los costos (grupo 5) se marcan tipo "gasto" porque el esquema solo admite cinco tipos.
# - Del modelo RG 49/2014 se omitieron cuentas de actividades que esta EAS no parece tener
#   (agro, ganadería, forestal, exportación, zona franca, maquila, turismo). Si las tuviera,
#   se agregan con el mismo código del modelo.
# - Los renglones de subtotal del Estado de Resultados (6, 9, 12, 16, 18 y 20) no son
#   cuentas y no se incluyen.

