# Formato de importación del Registro de Comprobantes de Marangatu (RG N° 90/2021).
#
# ESTADO: `pending`. NADA ESTÁ VERIFICADO.
# - Lo transcribió un asistente de IA el 2026-11-24 desde documentos oficiales de la DNIT.
# - Un contador debe revisarlo antes de que la aplicación genere archivos con este formato.
# - Probar siempre primero con un archivo chico en Marangatu (Herramientas / Consulta de
#   Archivos Importados) antes de confiar en una exportación masiva.
# - Detalle, citas y dudas: docs/research/TRIBUTACION_FASE4.md, sección 1.
#
# Regla de oro: los comprobantes ELECTRÓNICOS (SIFEN, con CDC) y VIRTUALES NO van en este archivo.
# Marangatu los trae solo ("Obtener Comprobantes Electrónicos y Virtuales"). Ver `exclusiones`.

meta:
  validation_status: pending
  reviewed_by: null
  consulted_at: "2026-11-24"
  confidence: oficial_leida
  sources:
    especificacion:
      title: "Especificación Técnica para Importación. Registro de Comprobantes de Ventas, Compras, Ingresos y/o Egresos"
      version: "1"
      date: "2021-06"          # «JUNIO 2021»; control de cambios: versión 1, 06/2021, versión inicial
      url: "https://www.dnit.gov.py/documents/20123/203596/Especificaciones+T%C3%A9cnicas+para+registro+de+comprobantes+en+Marangatu.pdf/fca12623-f680-a630-e624-8c825db31b7d?t=1684176028356"
      url_alternativa: "https://www.dnit.gov.py/documents/44828/0/Especificaciones+T%C3%A9cnicas+para+registro+de+comprobantes+en+Marangatu.pdf/fd50732c-4232-750a-b253-5b14843cdccb?t=1682430005384.pdf"
      note: "Las dos URL sirven el mismo PDF (comparados byte a byte). Es la única versión publicada que encontré."
    modelo_planilla:
      title: "Modelo de Planilla para Registro de Comprobantes en Marangatu.xlsx"
      date: "creado 2021-05-18, modificado 2022-09-08 (metadatos del archivo)"
      url: "https://www.dnit.gov.py/documents/44828/0/Modelo+de+Planilla+para+Registro+de+Comprobantes+en+Marangatu.xlsx/3012e5a2-57d7-86b4-db8b-6212d39c81f3?t=1682441199202"
      note: "Cuatro hojas (VENTAS, COMPRAS, INGRESOS, EGRESOS) con los encabezados en la fila 10. Las columnas coinciden con la especificación."
    guia_importacion:
