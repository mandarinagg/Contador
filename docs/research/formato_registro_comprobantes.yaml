      date: "2021-07"
      url: "https://www.dnit.gov.py/documents/20123/203596/Guia+Paso+a+Paso+-+Registro+de+comprobantes+a+trav%C3%A9s+de+Importaci%C3%B3n.pdf/c0d1917c-8952-79e5-9e72-a64777916fa8?t=1684165228356.pdf"
    presentacion_importar:
      title: "Registro de comprobantes a través del Sistema Marangatú «Opción Importar»"
      date: "2021-08 (metadatos)"
