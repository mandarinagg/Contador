      de Retención Virtual. No reciben timbrado preimpreso.
    parameters:
      applies_if_ruc_registration_on_or_after: "2025-04-01"
      allowed_systems: [e-Kuatia, e-Kuatiai]
    valid_from: "2025-04-01"
