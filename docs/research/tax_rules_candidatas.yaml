  # ---------------------------------------------------------------- LIBROS / SOCIETARIO
  - code: LIBROS-EAS
    description: >
      Libros obligatorios de la EAS: actas del órgano de gobierno, registro de acciones, actas del
      órgano de administración, diario e inventario. Según el FAQ del MIC deben estar rubricados.
      Atrasar el diario, inventario, mayor o compras/ventas más de 90 días corridos es infracción tributaria.
    parameters:
      books: [actas_organo_gobierno, registro_acciones, actas_organo_administracion, diario, inventario, mayor]
      max_delay_days: 90
      rubrica_required: true
    valid_from: "2020-01-13"
    valid_to: null
    published_at: "2020-01-13"
    source_url: "https://eas.mic.gov.py/files/LEY-EAS-6480-2020-1-.pdf"
    legal_reference: "Ley N° 6480/2020, art. 31; Decreto N° 3182/2019, art. 64; Res. DGPEJBF N° 02/2022, art. 8° (citada en el FAQ MIC)"
    consulted_at: "2026-11-24"
    validation_status: pending
    reviewed_by: null
    confidence: oficial_leida
    notes: >
      El «mayor» sale del Decreto 3182, no de la Ley 6480. La rúbrica la cita el FAQ, pero no leí
      la Res. 02/2022 (PDF escaneado). Duda D-7: libros digitales. valid_from inferido de la
